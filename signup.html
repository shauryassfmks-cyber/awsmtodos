<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AwsmTodos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .signup-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        .logo {
            text-align: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #667eea;
        }

        .signup-btn {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s;
            margin-bottom: 20px;
        }

        .signup-btn:hover {
            background: #5a6fd8;
        }

        .login-link {
            text-align: center;
            color: #666;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .signup-container {
                padding: 30px 20px;
            }
            
            .logo {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="logo">AwsmTodos</div>
        <p class="subtitle">Create your account</p>
        
        <form id="signupForm">
            <div class="form-group">
                <label for="creatorId">App Creator ID</label>
                <input type="text" id="creatorId" required>
            </div>
            
            <div class="form-group">
                <label for="creatorPassword">App Creator Password</label>
                <input type="password" id="creatorPassword" required>
            </div>
            
            <button type="submit" class="signup-btn">Sign Up</button>
            <div id="errorMessage" class="error-message" style="display: none;"></div>
        </form>
        
        <p class="login-link">
            Already have an account? <a href="login.html">Sign in</a>
        </p>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const creatorId = document.getElementById('creatorId').value;
            const creatorPassword = document.getElementById('creatorPassword').value;
            const errorMessage = document.getElementById('errorMessage');
            
            // Check if the creator credentials are correct
            if (creatorId === 'Shaurya_Is_Legend' && creatorPassword === 'shaurya_777') {
                // Store login state directly
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('username', creatorId);
                alert('Account created successfully!');
                window.location.href = 'todo-app.html';
            } else {
                errorMessage.textContent = 'Invalid App Creator ID or Password';
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
