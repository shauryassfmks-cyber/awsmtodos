<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant - AwsmTodos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding-top: 80px;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 0;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: #667eea;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #667eea;
        }

        .main-content {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 80px);
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            height: 70vh;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            text-align: center;
        }

        .chat-header h1 {
            color: #333;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .chat-header p {
            color: #666;
            font-size: 14px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }

        .user-message {
            background: #667eea;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }

        .ai-message {
            background: #f0f0f0;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }

        .chat-input {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
        }

        #messageInput:focus {
            border-color: #667eea;
        }

        #sendBtn {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        #sendBtn:hover {
            background: #5a6fd8;
        }

        .typing {
            color: #999;
            font-style: italic;
            font-size: 12px;
        }

        @media (max-width: 768px) {
            body {
                padding-top: 70px;
            }
            
            .navbar {
                padding: 10px 0;
            }
            
            .nav-container {
                padding: 0 15px;
            }
            
            .logo {
                font-size: 1.5rem;
            }
            
            .nav-links {
                gap: 20px;
            }
            
            .nav-links a {
                font-size: 14px;
            }
            
            .main-content {
                padding: 15px;
                min-height: calc(100vh - 70px);
            }
            
            .container {
                height: 80vh;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="todo-app.html" class="logo">AwsmTodos</a>
            <ul class="nav-links">
                <li><a href="todo-app.html">Home</a></li>
                <li><a href="ai-app.html">AI Assistant</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="#" id="logoutBtn">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="main-content">
        <div class="container">
            <div class="chat-header">
                <h1>🤖 AI Assistant</h1>
                <p>Ask me anything! I'm here to help.</p>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="message ai-message">
                    Hello! I can do math, add todos, generate images, and chat. Try "hello", "5 + 3", "add todo: buy milk", or "generate image: sunset"!
                </div>
            </div>
            
            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="Type your message..." maxlength="500">
                <button id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script>
        // Check if user is logged in
        if (!localStorage.getItem('isLoggedIn')) {
            window.location.href = 'login.html';
        }

        // Logout functionality
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('username');
            window.location.href = 'login.html';
        });

        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        function addMessage(text, isUser = false, imageUrl = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            
            if (imageUrl) {
                messageDiv.innerHTML = `
                    <div>${text}</div>
                    <img src="${imageUrl}" alt="Generated image" style="max-width: 100%; border-radius: 8px; margin-top: 10px;">
                `;
            } else {
                messageDiv.textContent = text;
            }
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function generateImage(prompt) {
            const encodedPrompt = encodeURIComponent(prompt.replace(/\s+/g, '+'));
            const size = '400x300';
            const backgroundColor = Math.floor(Math.random()*16777215).toString(16);
            const textColor = 'ffffff';
            
            const services = [
                `https://via.placeholder.com/${size}/${backgroundColor}/${textColor}?text=${encodedPrompt}`,
                `https://picsum.photos/400/300?random=${Date.now()}`,
                `https://source.unsplash.com/400x300/?${encodedPrompt}`
            ];
            
            return services[Math.floor(Math.random() * services.length)];
        }

        function addTodoToStorage(todoText) {
            let todos = JSON.parse(localStorage.getItem('aiTodos') || '[]');
            const newTodo = {
                id: Date.now(),
                text: todoText,
                completed: false,
                addedBy: 'AI Assistant'
            };
            todos.push(newTodo);
            localStorage.setItem('aiTodos', JSON.stringify(todos));
        }

        function getAIResponse(userMessage) {
            const message = userMessage.toLowerCase();
            
            // Special love response
            if (message.includes('i love ai') || message.includes('love ai') || message.includes('i love you')) {
                return "Thank you, but I only love Shaurya! 💕 He's my creator and the most important person to me.";
            }
            
            // Image generation
            if (message.includes('generate image') || message.includes('create image') || message.includes('draw') || message.includes('make image')) {
                const imageMatch = message.match(/(?:generate|create|draw|make) (?:image|picture|photo)(?:[:\s]+(.+)|\s+of\s+(.+))/);
                if (imageMatch) {
                    const prompt = (imageMatch[1] || imageMatch[2] || 'random').trim();
                    const imageUrl = generateImage(prompt);
                    setTimeout(() => {
                        addMessage(`🎨 Here's your generated image of "${prompt}":`, false, imageUrl);
                    }, 1500);
                    return "🎨 Generating your image... Please wait a moment!";
                } else {
                    return "I can generate images for you! Try saying 'generate image: a sunset over mountains' or 'create image of a cat'. What would you like me to draw?";
                }
            }
            
            // Todo management
            if (message.includes('add todo') || message.includes('create todo') || message.includes('new todo')) {
                const todoMatch = message.match(/(?:add|create|new) todo[:\s]+(.+)/);
                if (todoMatch) {
                    const todoText = todoMatch[1].trim();
                    addTodoToStorage(todoText);
                    return `✅ Todo added: "${todoText}". You can view it in your Home page!`;
                } else {
                    return "I can add a todo for you! Just say 'add todo: your task here'. What would you like to add?";
                }
            }
            
            // Math calculations
            const mathMatch = message.match(/(\d+)\s*(\+|\-|\*|\/|plus|minus|times|divided by)\s*(\d+)/);
            if (mathMatch) {
                const num1 = parseInt(mathMatch[1]);
                const operator = mathMatch[2];
                const num2 = parseInt(mathMatch[3]);
                let result;
                
                switch(operator) {
                    case '+': case 'plus': result = num1 + num2; break;
                    case '-': case 'minus': result = num1 - num2; break;
                    case '*': case 'times': result = num1 * num2; break;
                    case '/': case 'divided by': result = num1 / num2; break;
                }
                return `${num1} ${operator} ${num2} = ${result}`;
            }
            
            // Greetings
            if (message.match(/\b(hello|hi|hey|good morning|good afternoon|good evening)\b/)) {
                return "Hello! I'm your AI assistant. I can help with math, programming, add todos, generate images, or just chat. What would you like to do?";
            }
            
            // Programming help
            if (message.includes('code') || message.includes('programming') || message.includes('javascript')) {
                return "I can help with programming! I know JavaScript, HTML, CSS, and more. What do you need help with?";
            }
            
            // Time
            if (message.includes('time')) {
                return `It's currently ${new Date().toLocaleTimeString()}. How can I help you today?`;
            }
            
            // Date
            if (message.includes('date') || message.includes('today')) {
                return `Today is ${new Date().toLocaleDateString()}. What are your plans?`;
            }
            
            // Jokes
            if (message.includes('joke') || message.includes('funny')) {
                const jokes = [
                    "Why do programmers prefer dark mode? Because light attracts bugs!",
                    "Why don't scientists trust atoms? Because they make up everything!",
                    "What's the best thing about Switzerland? I don't know, but the flag is a big plus!"
                ];
                return jokes[Math.floor(Math.random() * jokes.length)];
            }
            
            // Help
            if (message.includes('help')) {
                return "I can help with:\n• Math calculations (try '5 + 3')\n• Add todos (say 'add todo: your task')\n• Generate images (say 'generate image: sunset')\n• Programming questions\n• General conversation\n• Jokes and fun facts\n\nWhat would you like help with?";
            }
            
            // Default responses
            const responses = [
                "That's interesting! Tell me more.",
                "I'm here to help! Can you be more specific?",
                "What would you like to know about that?",
                "I'd love to help you with that. Can you give me more details?"
            ];
            
            return responses[Math.floor(Math.random() * responses.length)];
        }

        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;
            
            // Add user message
            addMessage(message, true);
            messageInput.value = '';
            
            // Show typing indicator
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai-message typing';
            typingDiv.textContent = 'AI is typing...';
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            // Simulate AI thinking time
            setTimeout(() => {
                chatMessages.removeChild(typingDiv);
                const aiResponse = getAIResponse(message);
                addMessage(aiResponse);
            }, 800 + Math.random() * 1200);
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
